<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt – BaTool</title>
<meta name="description" content="Kontakt zu BaTool – Software und Daten für den ÖPNV">
<style>
  :root {
    --teal: #12343b;
    --cream: #f4f1ea;
    --orange: #e8892b;
    --muted: #5d747a;
    --line: #d8d3c6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--teal);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  .logo {
    max-width: 60rem;
    margin: 0 auto;
    padding: 2rem 1.5rem 1.5rem;
  }
  .logo img { display: block; width: 150px; height: auto; }

  .band {
    background: var(--teal);
    color: var(--cream);
  }
  .band-inner {
    max-width: 60rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 0;
  }
  .band h1 {
    margin: 0 0 .4rem;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .band p { margin: 0; font-size: 1.05rem; }
  .band a { color: var(--orange); text-decoration: none; }
  .band a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .band a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  .sep { margin: 0 .5em; color: var(--orange); }

  .route {
    position: relative;
    height: 40px;
    margin-top: 2.25rem;
    padding: 0 1.5rem;
  }
  .route::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 5px;
    margin-top: -2.5px;
    background: var(--muted);
  }
  .stops {
    position: relative;
    max-width: 57rem;
    height: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stops::before {
    content: "";
    position: absolute;
    left: 10px; right: 10px; top: 50%;
    height: 5px;
    margin-top: -2.5px;
    background: var(--cream);
  }
  .stops i {
    position: relative;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--teal);
    border: 4px solid var(--cream);
  }
  .stops i.end {
    width: 26px; height: 26px;
    margin-right: -3px;
    background: var(--orange);
    border-color: var(--orange);
  }

  main {
    max-width: 60rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
    gap: 2rem 3rem;
  }
  h2 {
    margin: 0 0 .35rem;
    font-size: .78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--orange);
  }
  p.v { margin: 0; font-size: 1.15rem; }
  main a {
    color: var(--teal);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  main a:hover { text-decoration-thickness: 2px; }
  main a:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  footer {
    max-width: 60rem;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 2.5rem;
    border-top: 1px solid var(--line);
    font-size: .85rem;
    color: var(--muted);
  }
</style>
</head>
